limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Resolve container addresses again after Compose recreates a backend.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream threat_api {
    zone threat_api 64k;
    server app_api:8080 resolve;
}

upstream scanner_api {
    zone scanner_api 64k;
    server scanner:8082 resolve;
}

server {
    listen 80;
    server_name localhost;
    return 308 https://$host:${NGINX_HTTPS_PORT}$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        return 429 '{"message":"Too many requests","details":"Rate limit exceeded"}';
    }

    location ~ ^/(scans|health|ready)$ {
        limit_req zone=api_limit burst=20 nodelay;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://scanner_api;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://threat_api;
    }
}
