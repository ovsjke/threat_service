services:
  nginx:
    image: nginx:stable-alpine

    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - app_api
      - scanner

    restart: unless-stopped
