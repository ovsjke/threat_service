services:
  nginx:
    image: nginx:stable-alpine

    environment:
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-443}
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-80}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-443}:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      app_api:
        condition: service_healthy
      scanner:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q && wget -q --no-check-certificate -O /dev/null https://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-24h}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles:
      - monitoring
    environment:
      DATA_SOURCE_URI: "db:5432/${DB_NAME:-mydatabase}?sslmode=disable"
      DATA_SOURCE_USER: ${DB_USER:-kaspersky}
      DATA_SOURCE_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    expose:
      - "9187"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.4.0
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  grafana_data:
  prometheus_data:
