global:
  scrape_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: threat_api
    static_configs:
      - targets:
          - app_api:8080
          
  - job_name: postgres
    static_configs:
      - targets:
          - postgres_exporter:9187