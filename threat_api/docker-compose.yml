services:
  db:
    image: postgres:16
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mydatabase}
      POSTGRES_USER: ${DB_USER:-kaspersky}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrations:
    image: migrate/migrate:v4.20.1
    command:
      - -path=/migrations
      - -database=${DB_URL:?Set DB_URL in .env}
      - up
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  app_api:
    stop_grace_period: ${API_STOP_GRACE_PERIOD:-10s}
    restart: unless-stopped
    build:
      context: ..
      dockerfile: threat_api/Dockerfile
    environment:
      API_PORT: ":8080"
      API_URL: ${API_URL:-https://localhost}
      API_READ_HEADER_TIMEOUT: ${API_READ_HEADER_TIMEOUT:-5s}
      API_READ_TIMEOUT: ${API_READ_TIMEOUT:-15s}
      API_WRITE_TIMEOUT: ${API_WRITE_TIMEOUT:-120s}
      API_IDLE_TIMEOUT: ${API_IDLE_TIMEOUT:-60s}
      API_SHUTDOWN_TIMEOUT: ${API_SHUTDOWN_TIMEOUT:-5s}
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      THREAT_CACHE_ENABLED: ${THREAT_CACHE_ENABLED:-false}
      THREAT_CACHE_TTL: ${THREAT_CACHE_TTL:-10m}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/metrics"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    expose:
      - "8080"
      - "50051"
    ports:
    - "127.0.0.1:${API_GRPC_HOST_PORT:-50051}:50051"
    - "127.0.0.1:${API_HTTP_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  e2e_app:
    build:
      context: ..
      dockerfile: threat_api/Dockerfile
    profiles:
      - e2e
    environment:
      API_PORT: ":8080"
      API_URL: "http://e2e_app:8080"
      DB_URL: "postgres://test:test@test_db:5432/threats_test?sslmode=disable"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/metrics"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${E2E_HOST_PORT:-8081}:8080"
    depends_on:
      test_db:
        condition: service_healthy
      test_migrations:
        condition: service_completed_successfully

  test_db:
    image: postgres:16
    profiles:
      - test
      - e2e
    environment:
      POSTGRES_DB: threats_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d threats_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  test_migrations:
    image: migrate/migrate:v4.20.1
    profiles:
      - test
      - e2e
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://test:test@test_db:5432/threats_test?sslmode=disable
      - up
    depends_on:
      test_db:
        condition: service_healthy

volumes:
  pgdata:
