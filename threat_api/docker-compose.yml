services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrations:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${DB_URL}
      - up
    depends_on:
      db:
        condition: service_healthy

  app_api:
    build:
      context: ..
      dockerfile: threat_api/Dockerfile
    env_file:
      - ../.env
    expose:
      - "8080"
      - "50051"
    ports:
    - "127.0.0.1:50051:50051"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  e2e_app:
    build:
      context: ..
      dockerfile: threat_api/Dockerfile
    profiles:
      - e2e
    environment:
      API_PORT: ":8080"
      API_URL: "http://localhost:8081"
      DB_URL: "postgres://test:test@test_db:5432/threats_test?sslmode=disable"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      test_db:
        condition: service_healthy
      test_migrations:
        condition: service_completed_successfully

  test_db:
    image: postgres:16
    profiles:
      - test
      - e2e
    environment:
      POSTGRES_DB: threats_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d threats_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  test_migrations:
    image: migrate/migrate
    profiles:
      - test
      - e2e
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://test:test@test_db:5432/threats_test?sslmode=disable
      - up
    depends_on:
      test_db:
        condition: service_healthy

volumes:
  pgdata:
