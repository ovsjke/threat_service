services:
  scanner:
    build:
      context: ..
      dockerfile: scanner/Dockerfile
    environment:
      SCANNER_HTTP_PORT: "8082"
      CLAMAV_ADDRESS: "clamav:3310"
      SCANNER_MAX_FILE_BYTES: ${SCANNER_MAX_FILE_BYTES:-10485760}
      SCANNER_MAX_CONCURRENT: ${SCANNER_MAX_CONCURRENT:-4}
      SCANNER_SCAN_TIMEOUT: ${SCANNER_SCAN_TIMEOUT:-60s}
      CLAMAV_DIAL_TIMEOUT: ${CLAMAV_DIAL_TIMEOUT:-3s}
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-60s}
      SCANNER_SHUTDOWN_TIMEOUT: ${SCANNER_SHUTDOWN_TIMEOUT:-15s}
      SCANNER_READ_HEADER_TIMEOUT: ${SCANNER_READ_HEADER_TIMEOUT:-5s}
      SCANNER_IDLE_TIMEOUT: ${SCANNER_IDLE_TIMEOUT:-60s}
      THREAT_GRPC_ADDR: app_api:50051
    ports:
      - "127.0.0.1:${SCANNER_HTTP_PORT:-8082}:8082"
    networks: [scanner, default]
    depends_on:
      clamav:
        condition: service_healthy
    stop_grace_period: ${SCANNER_STOP_GRACE_PERIOD:-20s}
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    environment:
      SCANNER_MAX_FILE_BYTES: ${SCANNER_MAX_FILE_BYTES:-10485760}
    entrypoint: ["/bin/sh", "/scanner-init.sh"]
    volumes:
      - clamav_data:/var/lib/clamav
      - ./clamav-init.sh:/scanner-init.sh:ro
    networks: [scanner]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  scanner:

volumes:
  clamav_data:
