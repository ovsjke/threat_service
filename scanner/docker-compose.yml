services:
  scanner:
    build:
      context: ..
      dockerfile: scanner/Dockerfile
    environment:
      SCANNER_HTTP_PORT: "8082"
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-clamav:3310}
      SCANNER_MAX_FILE_BYTES: ${SCANNER_MAX_FILE_BYTES:-10485760}
      SCANNER_MAX_CONCURRENT: ${SCANNER_MAX_CONCURRENT:-4}
      SCANNER_SCAN_TIMEOUT: ${SCANNER_SCAN_TIMEOUT:-60s}
      CLAMAV_DIAL_TIMEOUT: ${CLAMAV_DIAL_TIMEOUT:-3s}
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-60s}
      SCANNER_SHUTDOWN_TIMEOUT: ${SCANNER_SHUTDOWN_TIMEOUT:-15s}
      SCANNER_READ_HEADER_TIMEOUT: ${SCANNER_READ_HEADER_TIMEOUT:-5s}
      SCANNER_IDLE_TIMEOUT: ${SCANNER_IDLE_TIMEOUT:-60s}
      THREAT_GRPC_ADDR: ${THREAT_GRPC_ADDR:-app_api:50051}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      SCANNER_CACHE_ENABLED: ${SCANNER_CACHE_ENABLED:-false}
      SCANNER_CACHE_TTL: ${SCANNER_CACHE_TTL:-1h}
      SCANNER_CACHE_REDIS_TIMEOUT: ${SCANNER_CACHE_REDIS_TIMEOUT:-80ms}
      SCANNER_CACHE_POLICY_VERSION: ${SCANNER_CACHE_POLICY_VERSION:-v1}
      SCANNER_CACHE_VERSION_TIMEOUT: ${SCANNER_CACHE_VERSION_TIMEOUT:-500ms}
    ports:
      - "127.0.0.1:${SCANNER_HTTP_PORT:-8082}:8082"
    networks: [scanner, default]
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: ${SCANNER_STOP_GRACE_PERIOD:-20s}
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    environment:
      SCANNER_MAX_FILE_BYTES: ${SCANNER_MAX_FILE_BYTES:-10485760}
    entrypoint: ["/bin/sh", "/scanner-init.sh"]
    volumes:
      - clamav_data:/var/lib/clamav
      - ./clamav-init.sh:/scanner-init.sh:ro
    networks: [scanner]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 12
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  scanner:

volumes:
  clamav_data:
